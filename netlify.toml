# Netlify: Node serverless /api/chat + static widget from public/widget/ (committed in this repo).
# See README.md

[build]
  publish = "public"
  functions = "netlify/functions"
  command = "true"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/poll"
  to = "/.netlify/functions/poll"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true
